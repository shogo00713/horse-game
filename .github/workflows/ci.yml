name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 依存関係をインストール
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: テスト(Vitest)
        run: npm run test

      - name: ビルド(型チェック + Vite build)
        run: npm run build
